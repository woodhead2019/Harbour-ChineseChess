name: Build Harbour (Linux) - Stable Version

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main, master ]
    tags:
      - 'v*'          # 推送以 v 开头的 tag 时会同时触发发布步骤

env:
  HARBOUR_ROOT: /opt/harbour
  HB_VERSION: "3.2.0"
  HWGUI_ROOT: /opt/hwgui

jobs:
  build:
    name: Download → Build → Package → (Optional) Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 显式赋予创建 Release 所需的写权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
             build-essential autoconf automake libtool pkg-config git wget ca-certificates jq \
             libgtk2.0-dev libcairo2-dev libpango1.0-dev libglib2.0-dev libgdk-pixbuf2.0-dev \
             libx11-dev libxext-dev libxrandr-dev libfreetype6-dev libfontconfig1-dev \
             libpng-dev libjpeg-dev libtiff5-dev libgd-dev libfreeimage-dev \
             libcurl4-openssl-dev libmagic-dev unixodbc-dev ghostscript \
             libssl-dev

      - name: Verify pkg-config and headers
        run: |
           set -euo pipefail
           echo "gtk+-2.0 version:"
           pkg-config --modversion gtk+-2.0 || echo "gtk+-2.0 not found (pkg-config)"
           echo "cairo cflags:"
           pkg-config --cflags cairo || echo "cairo not found (pkg-config)"
           echo "Check key headers:"
           ls -d /usr/include/gtk-2.0 || true
           ls -l /usr/include/cairo || true
           gcc -v 2>&1 | sed -n '1,40p'

      - name: Download and extract Harbour core v3.2.0 and Hwgui 2.23b7
        run: |
          set -euo pipefail
          wget https://github.com/harbour/core/releases/download/v3.2.0/harbour-3.2.0.src.tar.gz
          wget https://www.kresin.ru/down/hwgui-2.23-b7.src.zip
          
          mkdir -p harbour-src
          tar -xzf harbour-3.2.0.src.tar.gz -C harbour-src
          mkdir -p hwgui-src
          unzip hwgui-2.23-b7.src.zip -d hwgui-src

          # 写入 GitHub 环境变量供后续 steps 使用
          echo "HB_SRC_DIR=$PWD/harbour-src" >> $GITHUB_ENV
          echo "HWGUI_SRC_DIR=$PWD/hwgui-src/hwgui" >> $GITHUB_ENV

      - name: Build (capture log)
        run: |
          set -euo pipefail
          cd "$HB_SRC_DIR"
          make -j"$(nproc)" 2>&1 | tee build.log || true
          
          cd "$HWGUI_SRC_DIR"
          "$HB_SRC_DIR/bin/linux/gcc/hbmk2" hwgui.hbp procmisc.hbp hbxml.hbp hwgdebug.hbp
          ls -la ./lib

      - name: Install into local prefix
        run: |
          set -euo pipefail
          cd "$HB_SRC_DIR"
          make install DESTDIR=$PWD/install || true

      - name: Populate /opt/harbour and /opt/hwgui directory structure
        run: |
          set -euo pipefail
          INSTALL_DIR="$HB_SRC_DIR/install"

          sudo mkdir -p ${HARBOUR_ROOT}/bin/linux/gcc
          sudo mkdir -p ${HARBOUR_ROOT}/include
          sudo mkdir -p ${HARBOUR_ROOT}/lib/linux/gcc

          if [ -d "$INSTALL_DIR/bin" ]; then
            sudo cp -r "$INSTALL_DIR/bin/"* ${HARBOUR_ROOT}/bin/linux/gcc/
          fi

          if [ -d "$INSTALL_DIR/include" ]; then
            sudo cp -r "$INSTALL_DIR/include/"* ${HARBOUR_ROOT}/include/
          fi

          if [ -d "$INSTALL_DIR/lib" ]; then
            sudo cp -r "$INSTALL_DIR/lib/"* ${HARBOUR_ROOT}/lib/linux/gcc/
          fi

          sudo mkdir -p ${HWGUI_ROOT}/include
          sudo mkdir -p ${HWGUI_ROOT}/lib/linux/gcc

          if [ -d "$HWGUI_SRC_DIR/include" ]; then
            sudo cp -r "$HWGUI_SRC_DIR/include/"* ${HWGUI_ROOT}/include/
          fi
          if [ -d "$HWGUI_SRC_DIR/lib" ]; then
            sudo cp -r "$HWGUI_SRC_DIR/lib/"*.a ${HWGUI_ROOT}/lib/linux/gcc/ || true
          fi

          echo "=== /opt directory structure ==="
          find /opt -type f | sort

      - name: Package build outputs (/opt)
        run: |
          set -euo pipefail
          # 直接将 /opt/harbour 和 /opt/hwgui 打包
          sudo tar -czf harbour-linux-build.tar.gz -C /opt harbour hwgui
          ls -lh harbour-linux-build.tar.gz

      - name: Upload artifact (build)
        uses: actions/upload-artifact@v4
        with:
          name: harbour-linux-build
          path: harbour-linux-build.tar.gz

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbour-build-log
          path: harbour-src/build.log

      - name: Create GitHub release and upload asset (only for tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release_and_upload
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          echo "Tag: $TAG"

          # Create release
          response=$(curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/releases \
            -d "$(jq -n --arg tag "$TAG" --arg name "$TAG" --arg body "Automated build for $TAG (Based on Harbour v3.2.0)" '{ tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false }')")
          
          upload_url=$(echo "$response" | jq -r .upload_url | sed -e "s/{?name,label}//")
          echo "Upload URL: $upload_url"

          if [ "$upload_url" = "null" ] || [ -z "$upload_url" ]; then
            echo "Error: Failed to create release or fetch upload_url"
            echo "API Response: $response"
            exit 1
          fi

          # upload asset
          curl --silent --show-error -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary @./harbour-linux-build.tar.gz \
            "${upload_url}?name=harbour-linux-build.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

